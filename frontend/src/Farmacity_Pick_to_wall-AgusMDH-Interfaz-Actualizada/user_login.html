<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif; /* Fuente del texto */
        }
        .container {
            background-color: #00a339;
            color: #fff;
            text-align: center;
            border-radius: 3%;
            padding: 20px;
            width: 300px;
            box-shadow: 40px, black;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .input-field {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 10px;
            border: 2px solid red;
            border-radius: 25px;
            background-color: white;
            font-size: 14px;
        }
        .button {
            background-color: #eb7100;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            font-family: 'Roboto', sans-serif; /* Fuente del texto */
        }
        .button:hover {
            background-color: #87ceeb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ingrese su ID Farmacity</h1>
        <input type="text" class="input-field" placeholder="Usuario">
        <input type="password" class="input-field" placeholder="Contraseña">
        <button class="button">Ingresar</button>
    </div>
</body>
</html>
